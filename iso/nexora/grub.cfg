set default=0
set timeout=3
set timeout_style=hidden

insmod all_video
insmod gfxterm
insmod gfxterm_background
insmod png
insmod font

loadfont /boot/grub/fonts/unicode.pf2
set gfxmode=1024x768x32,auto
terminal_output gfxterm
background_image --mode stretch /boot/nexora-splash.png

menuentry "Nexora OS" {
    set gfxpayload=text
    terminal_output console
    multiboot2 /boot/blackbit.elf
    boot
}
